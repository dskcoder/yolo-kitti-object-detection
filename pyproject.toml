[project]
name = "vpa-yolo-kitti"
version = "0.1.0"
description = "2D object detection for autonomous driving with YOLO on KITTI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ultralytics>=8.0.0",
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "numpy>=1.21.0",
  "opencv-python>=4.5.0",
  "pandas>=1.3.0",
  "scikit-learn>=0.24.0",
  "scipy>=1.7.0",
  "matplotlib>=3.4.0",
  "seaborn>=0.11.0",
  "pillow>=8.0.0",
  "requests>=2.25.0",
  "tqdm>=4.60.0",
  "pyyaml>=5.4.0",
  "jupyter>=1.0.0",
  "ipython>=7.0.0",
  "tensorboard>=2.8.0",
  "albumentations>=1.2.0",
  "pycocotools>=2.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
